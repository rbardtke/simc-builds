name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: simc commit sha (or branch) to build
        required: false
        default: midnight
      test:
        description: build only — the zips stay run artifacts, no release (the channel is untouched)
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "15 6 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

env:
  SIMC_BRANCH: midnight
  # the allocator of the Windows and Linux builds (MIT, github.com/microsoft/mimalloc):
  # ~9 % faster on Windows, 2–4 % on Linux, identical results (rbardtke/simhive#48)
  MIMALLOC_VERSION: v3.5.3

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      short: ${{ steps.r.outputs.short }}
      exists: ${{ steps.r.outputs.exists }}
    steps:
      - name: resolve commit
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="${{ github.event.inputs.ref }}"
          [ -n "$REF" ] || REF="$SIMC_BRANCH"
          SHA=$(git ls-remote https://github.com/simulationcraft/simc.git "refs/heads/$REF" | cut -f1)
          # not a branch: a sha, possibly abbreviated — the API expands it
          [ -n "$SHA" ] || SHA=$(gh api "repos/simulationcraft/simc/commits/$REF" --jq .sha 2>/dev/null || true)
          [ -n "$SHA" ] || SHA="$REF"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:12}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "test build: no release"
          elif gh release view "simc-$SHA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "release simc-$SHA exists, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bin: simc
          - os: windows-latest
            platform: windows-x64
            bin: simc.exe
          - os: macos-latest
            platform: macos-arm64
            bin: simc
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout simc
        uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: ${{ needs.resolve.outputs.sha }}
          path: simc
          fetch-depth: 1
      # mimalloc as simc's allocator (Windows and Linux; macOS keeps its own):
      # Windows links the static library and routes C++ new/delete to it with
      # the one line mimalloc documents for that; Linux links mimalloc.o, which
      # replaces malloc and new/delete itself — no source change there
      - name: mimalloc
        if: matrix.platform != 'macos-arm64'
        shell: bash
        run: |
          set -e
          git clone -q --depth 1 --branch "$MIMALLOC_VERSION" https://github.com/microsoft/mimalloc.git mimalloc
          cmake -S mimalloc -B mimalloc/build -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_SHARED=OFF -DMI_BUILD_TESTS=OFF -DMI_BUILD_OBJECT=${{ matrix.platform == 'linux-x64' && 'ON' || 'OFF' }}
          cmake --build mimalloc/build --config Release --parallel 4
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            sed -i '1i #include <mimalloc-new-delete.h> // simc-builds: C++ new/delete through mimalloc (rbardtke/simhive#48)' simc/engine/sc_main.cpp
            git -C simc diff > simc-mimalloc.diff
            head -2 simc/engine/sc_main.cpp
          fi
      - name: configure
        shell: bash
        run: |
          cd simc
          MI="$GITHUB_WORKSPACE/mimalloc"
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            CXXFLAGS="-I$MI/include" cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DBUILD_TESTING=OFF "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc $(find "$MI/build" -name 'mimalloc.o' | head -1)"
          elif [ "${{ matrix.platform }}" = "windows-x64" ]; then
            # MSVC takes -D and -I too; Git Bash would turn /D into a path
            CXXFLAGS="-I$(cygpath -m "$MI/include")" LDFLAGS="$(cygpath -m "$MI/build/Release/mimalloc.lib")" cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DBUILD_TESTING=OFF
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DSC_NO_NETWORKING=ON -DBUILD_TESTING=OFF
          fi
      - name: build
        shell: bash
        run: cmake --build simc/build --config Release --target simc --parallel 4
      # a build that says mimalloc but does not run it would be the worst of both
      - name: mimalloc is in
        if: matrix.platform != 'macos-arm64'
        shell: bash
        run: |
          BIN=$(find simc/build -name "${{ matrix.bin }}" -type f | head -1)
          printf 'deathknight="probe"\nlevel=90\nspec=unholy\niterations=1\n' > probe.simc
          MIMALLOC_VERBOSE=1 "$BIN" probe.simc 2>&1 | grep -m1 'mimalloc: process init' || { echo "mimalloc is not active in $BIN"; exit 1; }
      - name: package
        shell: bash
        run: |
          set -e
          SHA="${{ needs.resolve.outputs.sha }}"
          OUT="simc-$SHA-${{ matrix.platform }}"
          mkdir -p "pkg/$OUT"
          BIN=$(find simc/build -name "${{ matrix.bin }}" -type f | head -1)
          cp "$BIN" "pkg/$OUT/"
          cp simc/LICENSE* "pkg/$OUT/" 2>/dev/null || true
          cp simc/README.md "pkg/$OUT/README-simc.md"
          if [ -d mimalloc ]; then cp mimalloc/LICENSE "pkg/$OUT/LICENSE.mimalloc"; fi
          if [ -s simc-mimalloc.diff ]; then cp simc-mimalloc.diff "pkg/$OUT/"; fi
          {
            echo "SimulationCraft, built from https://github.com/simulationcraft/simc/commit/$SHA"
            echo "platform: ${{ matrix.platform }}  options: BUILD_GUI=OFF SC_NO_NETWORKING=ON"
            if [ -s simc-mimalloc.diff ]; then echo "allocator: mimalloc $MIMALLOC_VERSION (MIT, https://github.com/microsoft/mimalloc), static library; one line added to engine/sc_main.cpp: simc-mimalloc.diff"
            elif [ -d mimalloc ]; then echo "allocator: mimalloc $MIMALLOC_VERSION (MIT, https://github.com/microsoft/mimalloc), linked as mimalloc.o; simc's source unchanged"; fi
            echo "source of this exact build: simc-$SHA-source.tar.gz in the same release"
            echo "built by https://github.com/$GITHUB_REPOSITORY (not an official SimulationCraft release)"
          } > "pkg/$OUT/BUILD.txt"
          "pkg/$OUT/${{ matrix.bin }}" 2>&1 | grep -m1 -o 'SimulationCraft .*' > "pkg/$OUT/VERSION.txt" || true
          cd pkg && 7z a -tzip "../$OUT.zip" "$OUT" >/dev/null
          cd .. && ls -la "$OUT.zip"
      - name: dbc + source (linux only)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          SHA="${{ needs.resolve.outputs.sha }}"
          mkdir -p "pkg/simc-$SHA-dbc/engine/dbc/generated"
          cp simc/engine/dbc/generated/*.inc "pkg/simc-$SHA-dbc/engine/dbc/generated/"
          (cd pkg && 7z a -tzip "../simc-$SHA-dbc.zip" "simc-$SHA-dbc" >/dev/null)
          git -C simc archive --format=tar.gz --prefix="simc-$SHA/" -o "$GITHUB_WORKSPACE/simc-$SHA-source.tar.gz" HEAD
          # the rest of the corresponding source: the allocator (Windows' one-line change is simc-mimalloc.diff in its zip)
          git -C mimalloc archive --format=tar.gz --prefix="mimalloc-$MIMALLOC_VERSION/" -o "$GITHUB_WORKSPACE/simc-$SHA-mimalloc-source.tar.gz" HEAD
          ls -la simc-*-dbc.zip simc-*-source.tar.gz
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            simc-*.zip
            simc-*-source.tar.gz
          if-no-files-found: error
          # a hand-off to the release job, not storage: the release assets are
          # the copy that lasts. The default 90 days parked ~110 MB per daily
          # build against a 0.5 GB Actions allowance.
          retention-days: 1

  release:
    needs: [resolve, build]
    if: needs.resolve.outputs.exists == 'false' && github.event.inputs.test != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: sums
        run: |
          cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ needs.resolve.outputs.sha }}"
          VER=$(unzip -p "assets/simc-$SHA-linux-x64.zip" "simc-$SHA-linux-x64/VERSION.txt" 2>/dev/null | head -1 || true)
          gh release create "simc-$SHA" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "simc ${SHA:0:12}${VER:+ — $VER}" \
            --notes "SimulationCraft built from https://github.com/simulationcraft/simc/commit/$SHA (GPLv3), with BUILD_GUI=OFF SC_NO_NETWORKING=ON. Windows and Linux builds use mimalloc $MIMALLOC_VERSION (MIT) as the allocator — on Windows with one line added to engine/sc_main.cpp (simc-mimalloc.diff in the zip), on Linux linked in without a source change; no change to what simc computes. Source of this build: simc-$SHA-source.tar.gz and simc-$SHA-mimalloc-source.tar.gz. Not an official SimulationCraft release."
